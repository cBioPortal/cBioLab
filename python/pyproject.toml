[project]
name = "cohortlab"
version = "0.1.0"
description = "The Cohort Lab oncoprint render contract: decode it, build it from local tables, draw it"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "cBioPortal" }]
keywords = ["oncoprint", "cbioportal", "genomics", "cancer", "visualization"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://cohort-lab.vercel.app"
Source = "https://github.com/cBioPortal/cohort-lab"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["ruff==0.17.0"]

[project.scripts]
cohortlab = "cohortlab.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
cohortlab = ["style.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cohortlab*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# bugs, not style: pyflakes, bugbear and the statement-level pycodestyle errors
select = ["F", "B", "E4", "E7", "E9"]
# one-line statements and short names match the TypeScript this package ports;
# zip(strict=) would turn a length mismatch into an exception, a behaviour change
ignore = ["E702", "E731", "E741", "E402", "B905"]
