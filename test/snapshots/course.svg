t><text x="375" y="332.5" font-size="10" fill="#5b6b76" text-anchor="middle">7,392</text><text x="484.7" y="332.5" font-size="10" fill="#5b6b76" text-anchor="middle">5,364</text><text x="594.3" y="332.5" font-size="10" fill="#5b6b76" text-anchor="middle">4,005</text><text x="702.6" y="332.5" font-size="10" fill="#5b6b76" text-anchor="middle">2,887</text><line x1="8" y1="345" x2="26" y2="345" stroke="#E69F00" stroke-width="2"/><text x="46" y="348.5" font-size="10" fill="#5b6b76" text-anchor="middle">2,781</text><text x="155.7" y="348.5" font-size="10" fill="#5b6b76" text-anchor="middle">11,044</text><text x="265.3" y="348.5" font-size="10" fill="#5b6b76" text-anchor="middle">9,629</text><text x="375" y="348.5" font-size="10" fill="#5b6b76" text-anchor="middle">8,010</text><text x="484.7" y="348.5" font-size="10" fill="#5b6b76" text-anchor="middle">6,568</text><text x="594.3" y="348.5" font-size="10" fill="#5b6b76" text-anchor="middle">5,372</text><text x="702.6" y="348.5" font-size="10" fill="#5b6b76" text-anchor="middle">4,205</text><line x1="8" y1="369" x2="26" y2="369" stroke="#0072B2" stroke-width="2"/><text x="31" y="372.9" font-size="11" fill="#16232b">TP53 mut</text><line x1="95.46600000000001" y1="369" x2="113.46600000000001" y2="369" stroke="#E69F00" stroke-width="2"/><text x="118.5" y="372.9" font-size="11" fill="#16232b">TP53 wt</text><text x="8" y="395" font-size="10" fill="#5b6b76">Aligned on first Treatment — time 0 is that event, so every patient is lined up on the same clinical landmark. Patients with no such event are absent from</text><text x="8" y="409" font-size="10" fill="#5b6b76">every bin. THE DENOMINATOR IS NOT THE WHOLE COHORT: each bin is over the patients still under observation in it, from their first recorded event to their</text><text x="8" y="423" font-size="10" fill="#5b6b76">last contact (the later of their last recorded event and their OS follow-up where the study declares one). Without that, a curve would fall simply because</text><text x="8" y="437" font-size="10" fill="#5b6b76">follow-up ran out. Follow-up ending at the last recorded event biases the tail upward — by construction a patient has an event on their last observed day.</text><text x="8" y="451" font-size="10" fill="#5b6b76">Bins are half-open [t, t+3mo). The figure stops each line where fewer than 10 patients remain observable; the numbers past that point are in the result but</text><text x="8" y="465" font-size="10" fill="#5b6b76">not drawn. Event types carrying real durations are drawn as a state the patient is IN during the bin; the rest as an event that HAPPENED in it. That is read off</text><text x="8" y="479" font-size="10" fill="#5b6b76">the data, not the event's name.</text></svg>
