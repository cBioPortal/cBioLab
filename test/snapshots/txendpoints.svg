-size="10" fill="#5b6b76"><title>NSCLC, KRAS wild-type: 30 at risk at 48 months</title>30</text><text x="609" y="332.5" font-size="10" fill="#5b6b76"><title>NSCLC, KRAS wild-type: 7 at risk at 72 months</title>7</text><line x1="8" y1="353" x2="26" y2="353" stroke="#0072B2" stroke-width="2"/><text x="31" y="356.9" font-size="11" fill="#16232b">NSCLC, KRAS mutant<tspan dx="6" fill="#5b6b76">median 2.6 mo (95% CI 2.2 mo–2.7 mo) · n = 869 · 774 events</tspan></text><line x1="8" y1="371" x2="26" y2="371" stroke="#E69F00" stroke-width="2"/><text x="31" y="374.9" font-size="11" fill="#16232b">NSCLC, KRAS wild-type<tspan dx="6" fill="#5b6b76">median 2.6 mo (95% CI 2.4 mo–2.8 mo) · n = 1,480 · 1,309 events</tspan></text><text x="8" y="400" font-size="11" fill="#16232b" class="logrank">2-group log-rank χ² = 0.0001 (1 df) · p = 0.99</text><text x="8" y="419" font-size="10" fill="#5b6b76">Real-world progression-free survival: from the start of the first Treatment [SUBTYPE=Immuno] record to the first Diagnosis event after it with PROGRESSION</text><text x="8" y="433" font-size="10" fill="#5b6b76">in Y / Yes, or death. Progression read from the record (in MSK-CHORD, from notes by NLP) is only as complete as that recording; events on the anchor's own</text><text x="8" y="447" font-size="10" fill="#5b6b76">day are not counted. Censored at the last follow-up, which is OS_MONTHS × 30.4375 days on the timeline's clock; death is OS_STATUS 1:DECEASED. That</text><text x="8" y="461" font-size="10" fill="#5b6b76">OS_MONTHS counts from the timeline's day 0 was checked on these patients: 0 of 2,632 anchored patients have a timeline event more than 31 days past it</text><text x="8" y="475" font-size="10" fill="#5b6b76">(a study above 5% is refused). Left truncation as in the survival view: a patient whose anchor falls before day 0 enters the risk set at day 0. Left out: 5102</text><text x="8" y="489" font-size="10" fill="#5b6b76">cohort patients with no Treatment [SUBTYPE=Immuno] record, 0 with no follow-up after it, and 283 anchored before day 0 whose endpoint also came before</text><text x="8" y="503" font-size="10" fill="#5b6b76">it, so were never at risk. Medians with 95% intervals from the Greenwood band on the log scale. 2-group log-rank (1 df). Treated patients are not</text><text x="8" y="517" font-size="10" fill="#5b6b76">randomised: the cohorts can differ in who was offered the treatment, when, and how sick they were, so a difference here is an association. Each site sends</text><text x="8" y="531" font-size="10" fill="#5b6b76">only (entry, time, event) counts.</text></svg>
