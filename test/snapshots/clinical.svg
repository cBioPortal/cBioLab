<!-- view 0 clinical -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" role="img" aria-label="Clinical comparison — −log₁₀ q" style="max-width:720px;height:auto;display:block;font-family:'IBM Plex Sans',system-ui,sans-serif"><title>Clinical comparison — −log₁₀ q</title><rect width="720" height="250" fill="#ffffff"/><text x="8" y="16" font-size="12" fill="#16232b" font-weight="600">Clinical comparison — −log₁₀ q</text><rect x="8" y="28.5" width="10" height="10" rx="2" fill="#0072B2"/><text x="23" y="37" font-size="10" fill="#16232b">q &lt; 0.05</text><rect x="76.24000000000001" y="28.5" width="10" height="10" rx="2" fill="#9aa5ad"/><text x="91.2" y="37" font-size="10" fill="#16232b">not significant</text><line x1="88.5" y1="61" x2="88.5" y2="105" stroke="#dde4e8" stroke-width="0.75"/><line x1="220.2" y1="61" x2="220.2" y2="105" stroke="#dde4e8" stroke-width="0.75"/><line x1="351.8" y1="61" x2="351.8" y2="105" stroke="#dde4e8" stroke-width="0.75"/><line x1="483.4" y1="61" x2="483.4" y2="105" stroke="#dde4e8" stroke-width="0.75"/><line x1="615.1" y1="61" x2="615.1" y2="105" stroke="#dde4e8" stroke-width="0.75"/><rect x="4" y="61" width="712" height="22" fill="#dde4e8" opacity="0.3"/><text x="8" y="75.9" font-size="11" fill="#16232b">MSI_SCORE</text><rect x="88.5" y="66" width="308.8" height="12" rx="1.5" fill="#9aa5ad"></rect><text x="712" y="75.5" font-size="10" fill="#16232b" text-anchor="end">Welch t · q = 0.067</text><text x="8" y="97.9" font-size="11" fill="#16232b">AGE_AT_MET</text><rect x="88.5" y="88" width="30.5" height="12" rx="1.5" fill="#9aa5ad"></rect><text x="712" y="97.5" font-size="10" fill="#16232b" text-anchor="end">Welch t · q = 0.77</text><line x1="431.1" y1="61" x2="431.1" y2="105" stroke="#5b6b76" stroke-width="1" stroke-dasharray="3 3"/><text x="434.1" y="58" font-size="10" fill="#5b6b76">q = 0.05</text><line x1="88.5" y1="105" x2="88.5" y2="108" stroke="#5b6b76" stroke-width="1"/><text x="81.2" y="121" font-size="10" fill="#5b6b76">0.0</text><line x1="220.2" y1="105" x2="220.2" y2="108" stroke="#5b6b76" stroke-width="1"/><text x="212.8" y="121" font-size="10" fill="#5b6b76">0.5</text><line x1="351.8" y1="105" x2="351.8" y2="108" stroke="#5b6b76" stroke-width="1"/><text x="344.4" y="121" font-size="10" fill="#5b6b76">1.0</text><line x1="483.4" y1="105" x2="483.4" y2="108" stroke="#5b6b76" stroke-width="1"/><text x="476.1" y="121" font-size="10" fill="#5b6b76">1.5</text><line x1="615.1" y1="105" x2="615.1" y2="108" stroke="#5b6b76" stroke-width="1"/><text x="607.7" y="121" font-size="10" fill="#5b6b76">2.0</text><line x1="88.519" y1="105" x2="615.08" y2="105" stroke="#5b6b76" stroke-width="1"/><text x="351.8" y="140" font-size="11" fill="#16232b" text-anchor="middle">−log₁₀ q (Benjamini–Hochberg) — longer is stronger evidence of a difference</text><text x="8" y="162" font-size="10" fill="#5b6b76">Categorical attributes are compared with a Pearson chi-squared over the full value vocabulary; numeric ones with Welch's unequal-variance t-test (2</text><text x="8" y="176" font-size="10" fill="#5b6b76">cohorts) or Welch's ANOVA (3+) computed from (n, Σx, Σx²) per cohort — those totals are ADDITIVE across sites, so the pooled mean and variance are exact</text><text x="8" y="190" font-size="10" fill="#5b6b76">from per-site aggregates and no individual value is ever transmitted. Counting unit follows the attribute: patients for patient-level, samples for sample-level.</text><text x="8" y="204" font-size="10" fill="#5b6b76">q-values are Benjamini–Hochberg across the 2 tested attributes. Numeric attributes also show median/IQR and a rank-based test alongside the</text><text x="8" y="218" font-size="10" fill="#5b6b76">moment-based one — a Mann-Whitney U for 2 cohorts, Kruskal-Wallis for 3+ (neither itself part of the q-value correction) — computed from the attribute's</text><text x="8" y="232" font-size="10" fill="#5b6b76">complete value distribution, which is only exact and only requested because this view is confined to a single study.</text></svg>
