t-size="10" fill="#5b6b76">regression (Efron ties) within each CANCER_TYPE, univariate. 43,375 patients and 16,953 events had a time, the exposure and a CANCER_TYPE; 30 rows were</text><text x="8" y="823" font-size="10" fill="#5b6b76">estimated. Panel-aware: a patient not profiled for the gene is left out, never counted as unaltered. 4,135 patients lacked the endpoint, the stratum or a covariate and</text><text x="8" y="837" font-size="10" fill="#5b6b76">were left out. 669 patients whose samples carry different values of CANCER_TYPE were left out: they belong to no one stratum. “Other (34 strata)” pools 34 strata</text><text x="8" y="851" font-size="10" fill="#5b6b76">(each under 30 patients or 10 events, or past the 30 largest), fit with a baseline hazard of its own per stratum. Not estimated: CNS Cancer (no event among the</text><text x="8" y="865" font-size="10" fill="#5b6b76">exposed). Pooled by inverse variance: fixed effect, and DerSimonian–Laird random effects (τ² 0.121, I² 93%, Cochran's Q 424.1 on 29 df, p 9.8e-72). A high I² says</text><text x="8" y="879" font-size="10" fill="#5b6b76">the strata disagree beyond chance: the pooled estimate is then an average over different effects, not one effect. Association, not cause: the exposure travels with</text><text x="8" y="893" font-size="10" fill="#5b6b76">stage, treatment and other prognostic factors not adjusted for. Proportional hazards within each row is assumed, not checked.</text></svg>
