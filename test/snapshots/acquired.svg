ext x="8" y="358" font-size="10" fill="#5b6b76">Patients with a sample in the cohort dated on or before their first Treatment [SUBTYPE=Systemic therapy] and another at least 30 days after it; each side is one sample —</text><text x="8" y="372" font-size="10" fill="#5b6b76">the last before and the first after — dated by its first Sample acquisition/Sequencing/Specimen timeline event (attribute SAMPLE_ID). Funnel: all patients — 142 started,</text><text x="8" y="386" font-size="10" fill="#5b6b76">67 with a sample before, 107 with one after, 33 patients with both (median 27 days before and 279 after; samples a median 301 days apart, IQR 154–514). Per gene,</text><text x="8" y="400" font-size="10" fill="#5b6b76">counting only patients whose before- AND after-sample panels both cover it: an OncoKB oncogenic alteration (v7.5) after but not before (acquired), before but not after</text><text x="8" y="414" font-size="10" fill="#5b6b76">(lost), on both (shared). The exact McNemar test asks whether acquired and lost differ; q is Benjamini–Hochberg across the genes tested in each cohort — every gene</text><text x="8" y="428" font-size="10" fill="#5b6b76">altered after treatment in at least 3 patients (all patients: 30 genes), the 12 smallest p drawn. These are few patients, and a second biopsy is clinically indicated —</text><text x="8" y="442" font-size="10" fill="#5b6b76">typically taken at progression — so they are a selected group, and &quot;acquired&quot; means seen after and not before, not caused by the treatment: a subclone the first biopsy</text><text x="8" y="456" font-size="10" fill="#5b6b76">missed, a different lesion, or a lower-purity sample under-calling one side reads the same. Which treatment ran between the samples beyond the anchor is not</text><text x="8" y="470" font-size="10" fill="#5b6b76">considered.</text></svg>
