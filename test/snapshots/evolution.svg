"/></g><g class="evo-line"><title>RASA1 H1005R (Missense Mutation) — 1: not found (0 of 299 reads) · 2: VAF 0.15 (55 of 371 reads) · 3: not found (0 of 205 reads) · 4: not found (0 of 255 reads)</title><circle cx="176" cy="201.4" r="3" fill="#16232b"/></g><g transform="translate(8,318)"><circle cx="5" cy="0" r="3" fill="#16232b"/></g><text x="24" y="321.5" font-size="10" fill="#5b6b76">called</text><g transform="translate(71.1,318)"><circle cx="5" cy="0" r="3" fill="#ffffff" stroke="#16232b" stroke-width="1"/></g><text x="87.1" y="321.5" font-size="10" fill="#5b6b76">uncalled, variant reads found</text><g transform="translate(237.5,318)"><rect x="2.5" y="-2.5" width="5" height="5" fill="#ffffff" stroke="#16232b" stroke-width="1"/></g><text x="253.5" y="321.5" font-size="10" fill="#5b6b76">not found (VAF 0)</text><g transform="translate(352.2,318)"><line x1="0" y1="0" x2="12" y2="0" stroke="#16232b" stroke-dasharray="3 3"/></g><text x="368.2" y="321.5" font-size="10" fill="#5b6b76">across a not-profiled sample, or one without allele counts</text><circle cx="13" cy="342.5" r="4" fill="black"/><text x="23" y="346" font-size="10" fill="#16232b">1 · Patient-28-T1<tspan dx="6" fill="#5b6b76">Primary, day 0</tspan></text><circle cx="192.3" cy="342.5" r="4" fill="orange"/><text x="202.3" y="346" font-size="10" fill="#16232b">2 · Patient-28-T3<tspan dx="6" fill="#5b6b76">Recurrence, day 227</tspan></text><circle cx="400.27" cy="342.5" r="4" fill="orange"/><text x="410.3" y="346" font-size="10" fill="#16232b">3 · Patient-28-T2<tspan dx="6" fill="#5b6b76">Recurrence, day 903</tspan></text><circle cx="13" cy="359.5" r="4" fill="#333333"/><text x="23" y="363" font-size="10" fill="#16232b">4 · Patient-28-CSF<tspan dx="6" fill="#5b6b76">Unknown_Tumor, day 1279</tspan></text><text x="8" y="385" font-size="10" fill="#5b6b76">IM-GBM-28: 4 samples in collection order, placed by the day each was collected (days from diagnosis, from the study's timeline). 8 mutations; 8 are drawn. VAF is</text><text x="8" y="399" font-size="10" fill="#5b6b76">variant reads ÷ (variant + reference reads) in each sample. A mutation called in one sample is followed into the others: there it is an uncalled mutation where the</text><text x="8" y="413" font-size="10" fill="#5b6b76">study's uncalled-mutations profile found variant reads (drawn with that VAF), not found (VAF 0) where the sample was sequenced for the gene, or NOT PROFILED</text><text x="8" y="427" font-size="10" fill="#5b6b76">where the sample's panel does not cover the gene — never 0. A line joins a mutation's VAFs from the first to the last sample with variant reads, as the portal draws it;</text><text x="8" y="441" font-size="10" fill="#5b6b76">it bridges a not-profiled sample, or one called without allele counts, with a dashed segment. Fusions recorded as mutations are left out, as the portal leaves them out.</text><text x="8" y="455" font-size="10" fill="#5b6b76">The patient list holds the cohort's patients with two or more samples and a mutation with allele counts: 36 patients. Sorted with the most samples first, then by</text><text x="8" y="469" font-size="10" fill="#5b6b76">patient id across the cohort; every page is a slice of that one order, and the download holds every row kept, with every column.</text></svg>
