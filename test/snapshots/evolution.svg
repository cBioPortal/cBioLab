ads) · 3: not found (0 of 160 reads) · 4: VAF 0.10 (33 of 333 reads)</title><line x1="179.9" y1="177.4" x2="535.3" y2="234" stroke="#16232b" stroke-width="1" stroke-opacity="0.55"/><line x1="179.9" y1="177.4" x2="535.3" y2="234" stroke="transparent" stroke-width="8"/><line x1="535.3" y1="234" x2="733" y2="212.2" stroke="#16232b" stroke-width="1" stroke-opacity="0.55"/><line x1="535.3" y1="234" x2="733" y2="212.2" stroke="transparent" stroke-width="8"/><circle data-s="1" cx="179.9" cy="177.4" r="3" fill="#16232b"/><rect data-s="2" x="532.8" y="231.5" width="5" height="5" fill="#ffffff" stroke="#16232b" stroke-width="1"/><circle data-s="3" cx="733" cy="212.2" r="3" fill="#16232b"/></g><g class="evo-line" data-key="PIK3R2|D610G|19|18279556|18279556|A|G"><title>PIK3R2 D610G (Missense Mutation) — 1: not found (0 of 132 reads) · 2: VAF 0.26 (108 of 423 reads) · 3: not found (0 of 470 reads) · 4: VAF 0.15 (58 of 392 reads)</title><line x1="179.9" y1="177.8" x2="535.3" y2="234" stroke="#16232b" stroke-width="1" stroke-opacity="0.55"/><line x1="179.9" y1="177.8" x2="535.3" y2="234" stroke="transparent" stroke-width="8"/><line x1="535.3" y1="234" x2="733" y2="201.4" stroke="#16232b" stroke-width="1" stroke-opacity="0.55"/><line x1="535.3" y1="234" x2="733" y2="201.4" stroke="transparent" stroke-width="8"/><circle data-s="1" cx="179.9" cy="177.8" r="3" fill="#16232b"/><rect data-s="2" x="532.8" y="231.5" width="5" height="5" fill="#ffffff" stroke="#16232b" stroke-width="1"/><circle data-s="3" cx="733" cy="201.4" r="3" fill="#16232b"/></g><g class="evo-line" data-key="RASA1|H1005R|5|86685298|86685298|A|G"><title>RASA1 H1005R (Missense Mutation) — 1: not found (0 of 299 reads) · 2: VAF 0.15 (55 of 371 reads) · 3: not found (0 of 205 reads) · 4: not found (0 of 255 reads)</title><circle data-s="1" cx="179.9" cy="201.4" r="3" fill="#16232b"/></g><g transform="translate(8,315)"><circle cx="5" cy="0" r="3" fill="#16232b"/></g><text x="24" y="318.5" font-size="10" fill="#5b6b76">called</text><g transform="translate(71.1,315)"><circle cx="5" cy="0" r="3" fill="#ffffff" stroke="#16232b" stroke-width="1"/></g><text x="87.1" y="318.5" font-size="10" fill="#5b6b76">uncalled, variant reads found</text><g transform="translate(237.5,315)"><rect x="2.5" y="-2.5" width="5" height="5" fill="#ffffff" stroke="#16232b" stroke-width="1"/></g><text x="253.5" y="318.5" font-size="10" fill="#5b6b76">not found (VAF 0)</text><g transform="translate(352.2,315)"><line x1="0" y1="0" x2="12" y2="0" stroke="#16232b" stroke-dasharray="3 3"/></g><text x="368.2" y="318.5" font-size="10" fill="#5b6b76">across a not-profiled sample, or one without allele counts</text><circle cx="13" cy="339.5" r="4" fill="black"/><text x="23" y="343" font-size="10" fill="#16232b">1 · Patient-28-T1<tspan dx="6" fill="#5b6b76">Primary, day 0</tspan></text><circle cx="192.3" cy="339.5" r="4" fill="orange"/><text x="202.3" y="343" font-size="10" fill="#16232b">2 · Patient-28-T3<tspan dx="6" fill="#5b6b76">Recurrence, day 227</tspan></text><circle cx="400.27" cy="339.5" r="4" fill="orange"/><text x="410.3" y="343" font-size="10" fill="#16232b">3 · Patient-28-T2<tspan dx="6" fill="#5b6b76">Recurrence, day 903</tspan></text><circle cx="13" cy="356.5" r="4" fill="#333333"/><text x="23" y="360" font-size="10" fill="#16232b">4 · Patient-28-CSF<tspan dx="6" fill="#5b6b76">Unknown_Tumor, day 1279</tspan></text><text x="8" y="382" font-size="10" fill="#5b6b76">IM-GBM-28: 4 samples in collection order, placed by the day each was collected (days from diagnosis, from the study's timeline) on the patient's timeline axis — a tick</text><text x="8" y="396" font-size="10" fill="#5b6b76">a year across all the patient's events, empty stretches of four or more years cut, as the portal's. 8 mutations; 8 are drawn. VAF is variant reads ÷ (variant + reference</text><text x="8" y="410" font-size="10" fill="#5b6b76">reads) in each sample. A mutation called in one sample is followed into the others: there it is an uncalled mutation where the study's uncalled-mutations profile found</text><text x="8" y="424" font-size="10" fill="#5b6b76">variant reads (drawn with that VAF), not found (VAF 0) where the sample was sequenced for the gene, or NOT PROFILED where the sample's panel does not cover the</text><text x="8" y="438" font-size="10" fill="#5b6b76">gene — never 0. A line joins a mutation's VAFs from the first to the last sample with variant reads, as the portal draws it; it bridges a not-profiled sample, or one called</text><text x="8" y="452" font-size="10" fill="#5b6b76">without allele counts, with a dashed segment. Fusions recorded as mutations are left out, as the portal leaves them out. The patient list holds the cohort's patients</text><text x="8" y="466" font-size="10" fill="#5b6b76">with two or more samples and a mutation with allele counts: 36 patients. Sorted with the most samples first, then by patient id across the cohort; every page is a slice</text><text x="8" y="480" font-size="10" fill="#5b6b76">of that one order, and the download holds every row kept, with every column.</text></svg>
