ll="#5b6b76"><title>NSMP: 105 at risk at 24 months</title>105</text><text x="288.6" y="654.5" font-size="10" fill="#5b6b76"><title>NSMP: 49 at risk at 48 months</title>49</text><text x="373.4" y="654.5" font-size="10" fill="#5b6b76"><title>NSMP: 24 at risk at 72 months</title>24</text><text x="461.2" y="654.5" font-size="10" fill="#5b6b76"><title>NSMP: 5 at risk at 96 months</title>5</text><text x="546" y="654.5" font-size="10" fill="#5b6b76"><title>NSMP: 3 at risk at 120 months</title>3</text><text x="630.8" y="654.5" font-size="10" fill="#5b6b76"><title>NSMP: 2 at risk at 144 months</title>2</text><text x="715.6" y="654.5" font-size="10" fill="#5b6b76"><title>NSMP: 2 at risk at 168 months</title>2</text><text x="800.4" y="654.5" font-size="10" fill="#5b6b76"><title>NSMP: 1 at risk at 192 months</title>1</text><text x="885.2" y="654.5" font-size="10" fill="#5b6b76"><title>NSMP: 1 at risk at 216 months</title>1</text><line x1="8" y1="675" x2="26" y2="675" stroke="#0072B2" stroke-width="2"/><text x="31" y="678.9" font-size="11" fill="#16232b">POLE-ultramutated<tspan dx="6" fill="#5b6b76">n = 49 · 2 deaths · median not reached</tspan></text><line x1="476" y1="675" x2="494" y2="675" stroke="#E69F00" stroke-width="2"/><text x="499" y="678.9" font-size="11" fill="#16232b">MMR-deficient<tspan dx="6" fill="#5b6b76">n = 124 · 15 deaths · median not reached</tspan></text><line x1="8" y1="693" x2="26" y2="693" stroke="#009E73" stroke-width="2"/><text x="31" y="696.9" font-size="11" fill="#16232b">p53-abnormal<tspan dx="6" fill="#5b6b76">n = 150 · 43 deaths · median 102 mo</tspan></text><line x1="476" y1="693" x2="494" y2="693" stroke="#CC79A7" stroke-width="2"/><text x="499" y="696.9" font-size="11" fill="#16232b">NSMP<tspan dx="6" fill="#5b6b76">n = 167 · 22 deaths · median not reached</tspan></text><text x="8" y="722" font-size="11" fill="#16232b">4-group log-rank χ² = 27.4 (3 df) · p = 4.9e-6</text><text x="8" y="743" font-size="10" fill="#5b6b76">Endometrial carcinoma molecular classification (TCGA 2013 / ProMisE / WHO 2020) (TCGA, Nature 2013; Talhouk et al., ProMisE, Br J Cancer 2015; WHO Classification</text><text x="8" y="757" font-size="10" fill="#5b6b76">of Female Genital Tumours, 5th ed. 2020), applied per patient over their samples in the cohort, in this order, first match wins: POLE-ultramutated — a somatic POLE</text><text x="8" y="771" font-size="10" fill="#5b6b76">exonuclease-domain hotspot called in any of those samples (P286R, S297F, F367S, F367V, V411L, L424I, L424V, P436R, M444K, A456P, S459F, M295R, D368Y;</text><text x="8" y="785" font-size="10" fill="#5b6b76">León-Castillo et al. 2020); else MMR-deficient — MSI-high in any of those samples by MSI_SENSOR_SCORE (MSIsensor; ≥ 10 MSI-high, &lt; 3 stable) (from the MSI call, not</text><text x="8" y="799" font-size="10" fill="#5b6b76">mismatch-repair immunohistochemistry, which the warehouse does not hold); else p53-abnormal — a TP53 mutation the OncoKB store (v7.5) calls oncogenic or likely</text><text x="8" y="813" font-size="10" fill="#5b6b76">oncogenic (a sequencing proxy for p53 immunohistochemistry); else NSMP. A patient is “not classifiable”, never put in a subtype by guess, when an input the hierarchy</text><text x="8" y="827" font-size="10" fill="#5b6b76">needs before reaching their subtype is missing: not sequenced, not profiled for POLE or TP53 (panel-aware), or no MSI-high or stable call (an indeterminate or unreported</text><text x="8" y="841" font-size="10" fill="#5b6b76">MSI result counts as none) — 38 patients here (no MSI call 26, not sequenced 12), kept out of the shares, tests and curves. Shares are of classified patients. By SUBTYPE</text><text x="8" y="855" font-size="10" fill="#5b6b76">per patient (“Multiple” when samples disagree; the 8 largest groups drawn, the rest pooled into a named Other), chi-squared over group × subtype per cohort, patients</text><text x="8" y="869" font-size="10" fill="#5b6b76">without a value left out of the test. Overall survival by subtype from OS_MONTHS / OS_STATUS as the study records them (for each cohort), Kaplan–Meier with a k-group</text><text x="8" y="883" font-size="10" fill="#5b6b76">log-rank; OS is not corrected for left truncation (a patient sequenced years after diagnosis entered the study alive), and the subtypes differ in stage, histology and</text><text x="8" y="897" font-size="10" fill="#5b6b76">treatment, none adjusted for. A panel-based call is not the clinical assay: POLE variants outside the hotspot list, MSI by IHC, and p53 IHC patterns are not seen.</text></svg>
