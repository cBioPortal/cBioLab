="254.5" font-size="10" fill="#5b6b76" text-anchor="end">14.3%</text><text x="886.4" y="254.5" font-size="10" fill="#5b6b76" text-anchor="end">42</text><text x="952" y="254.5" font-size="10" fill="#5b6b76" text-anchor="end">1.00</text><rect x="4" y="261" width="952" height="20" fill="#dde4e8" opacity="0.3"/><text x="44.6" y="274.9" font-size="11" fill="#16232b" text-anchor="end" font-weight="600">BAALC</text><rect x="58.6" y="264" width="78.8" height="14" fill="#0072B2"><title>BAALC — 8 patients altered before only</title></rect><text x="98" y="274.5" font-size="10" fill="#ffffff" text-anchor="middle">8</text><rect x="137.4" y="264" width="9.9" height="14" fill="#9aa5ad"><title>BAALC — 1 patients altered both</title></rect><rect x="147.2" y="264" width="29.6" height="14" fill="#E69F00"><title>BAALC — 3 patients altered after only</title></rect><text x="162" y="274.5" font-size="10" fill="#16232b" text-anchor="middle">3</text><text x="813" y="274.5" font-size="10" fill="#5b6b76" text-anchor="end">8.3%</text><text x="886.4" y="274.5" font-size="10" fill="#5b6b76" text-anchor="end">42</text><text x="952" y="274.5" font-size="10" fill="#5b6b76" text-anchor="end">1.00</text><text x="44.6" y="294.9" font-size="11" fill="#16232b" text-anchor="end" font-weight="600">UBR5</text><rect x="58.6" y="284" width="78.8" height="14" fill="#0072B2"><title>UBR5 — 8 patients altered before only</title></rect><text x="98" y="294.5" font-size="10" fill="#ffffff" text-anchor="middle">8</text><rect x="137.4" y="284" width="9.9" height="14" fill="#9aa5ad"><title>UBR5 — 1 patients altered both</title></rect><rect x="147.2" y="284" width="29.6" height="14" fill="#E69F00"><title>UBR5 — 3 patients altered after only</title></rect><text x="162" y="294.5" font-size="10" fill="#16232b" text-anchor="middle">3</text><text x="813" y="294.5" font-size="10" fill="#5b6b76" text-anchor="end">8.3%</text><text x="886.4" y="294.5" font-size="10" fill="#5b6b76" text-anchor="end">42</text><text x="952" y="294.5" font-size="10" fill="#5b6b76" text-anchor="end">1.00</text><line x1="58.6" y1="301" x2="58.6" y2="304" stroke="#5b6b76" stroke-width="1"/><text x="55.6" y="317" font-size="10" fill="#5b6b76">0</text><line x1="157.1" y1="301" x2="157.1" y2="304" stroke="#5b6b76" stroke-width="1"/><text x="151.1" y="317" font-size="10" fill="#5b6b76">10</text><line x1="255.6" y1="301" x2="255.6" y2="304" stroke="#5b6b76" stroke-width="1"/><text x="249.6" y="317" font-size="10" fill="#5b6b76">20</text><line x1="354.1" y1="301" x2="354.1" y2="304" stroke="#5b6b76" stroke-width="1"/><text x="348.1" y="317" font-size="10" fill="#5b6b76">30</text><line x1="452.6" y1="301" x2="452.6" y2="304" stroke="#5b6b76" stroke-width="1"/><text x="446.6" y="317" font-size="10" fill="#5b6b76">40</text><line x1="551.1" y1="301" x2="551.1" y2="304" stroke="#5b6b76" stroke-width="1"/><text x="545.1" y="317" font-size="10" fill="#5b6b76">50</text><line x1="649.6" y1="301" x2="649.6" y2="304" stroke="#5b6b76" stroke-width="1"/><text x="643.6" y="317" font-size="10" fill="#5b6b76">60</text><line x1="748.1" y1="301" x2="748.1" y2="304" stroke="#5b6b76" stroke-width="1"/><text x="742.1" y="317" font-size="10" fill="#5b6b76">70</text><line x1="58.553" y1="301" x2="748.0899999999999" y2="301" stroke="#5b6b76" stroke-width="1"/><text x="403.3" y="336" font-size="11" fill="#16232b" text-anchor="middle">patients altered on either side</text><text x="8" y="358" font-size="10" fill="#5b6b76">Within patients with samples on both sides, before and after (egc_msk_2017: IMPACT_PRE_POST PRE-TX vs POST-TX; breast_alpelisib_2020:</text><text x="8" y="372" font-size="10" fill="#5b6b76">SAMPLE_COLLECTION_TIMEPOINT pre-treatment vs post-treatment; egc_trap_ccr_msk_2023: PRE_OR_POST_TREATMENT Pre vs Post; blca_cornell_2016:</text><text x="8" y="386" font-size="10" fill="#5b6b76">SPECIMEN_COLLECTION_PRE_OR_POST_CHEMO pre-chemotherapy vs post-chemotherapy; brca_dldccc_2022: TREATMENT_STATUS Pre-Treatment vs</text><text x="8" y="400" font-size="10" fill="#5b6b76">Post-Treatment; before and after treatment: 111 patients), per gene, among those profiled for it on BOTH sides by each side's own panels: an OncoKB driver (v7.5) on</text><text x="8" y="414" font-size="10" fill="#5b6b76">both sides, on the before side only, or the after side only; a patient with several samples on a side counts as altered there if any is. Both sides are the cohort's own</text><text x="8" y="428" font-size="10" fill="#5b6b76">samples, so a cohort that selects one kind of sample has no pairs. Concordance is both ÷ altered anywhere. The exact McNemar test asks whether discordance runs one</text><text x="8" y="442" font-size="10" fill="#5b6b76">way; q is Benjamini–Hochberg across the genes of each cohort. Genes were not chosen in advance: every gene with a driver in some paired patient was tested (before</text><text x="8" y="456" font-size="10" fill="#5b6b76">and after treatment: 278 genes with a discordant patient), q is taken across all of them, and the 12 most one-sided are drawn — at these sizes, read the counts, not only</text><text x="8" y="470" font-size="10" fill="#5b6b76">the q. Sides are as each study labels its samples; after-only means seen on that side and not the other, which is not proof it arose or vanished in between — a subclone</text><text x="8" y="484" font-size="10" fill="#5b6b76">one biopsy missed, or a lower-purity sample (common after treatment) under-calling its side, reads the same; and patients sampled twice are a selected group, typically</text><text x="8" y="498" font-size="10" fill="#5b6b76">with longer or harder disease courses. Counts are summed across 5 studies.</text></svg>
