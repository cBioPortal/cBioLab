TORC1 complex. The mTORC1 functions as a metabolic sensor</text><text x="8" y="843.1821656050955" font-size="10" fill="#5b6b76">and controls protein abundance by affecting processes involved in protein production and RNA translation leading to changes in cell growth and survival.</text><text x="8" y="857.1821656050955" font-size="10" fill="#5b6b76">Each gene node shows its altered % in all patients: samples with a mutation, amplification, deep deletion or structural variant in the gene, of those profiled</text><text x="8" y="871.1821656050955" font-size="10" fill="#5b6b76">for it. A thick border marks a query gene (TP53, PIK3CA, CDH1, GATA3, MAP3K1, PTEN, AKT1). Drawn as the best-ranked TCGA PanCanAtlas pathway by the</text><text x="8" y="885.1821656050955" font-size="10" fill="#5b6b76">number of query genes it holds (score 3; PIK3CA, PTEN, AKT1). Next: Cell Cycle 1, TP53 1, HIPPO 0. Diagram: PathwayMapper (i-Vis at Bilkent).</text></svg>
