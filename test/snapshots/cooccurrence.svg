"521.5" y1="377" x2="521.5" y2="380" stroke="#5b6b76" stroke-width="1"/><text x="518.5" y="393" font-size="10" fill="#5b6b76">4</text><line x1="606.6" y1="377" x2="606.6" y2="380" stroke="#5b6b76" stroke-width="1"/><text x="603.6" y="393" font-size="10" fill="#5b6b76">6</text><line x1="95.966" y1="377" x2="606.58" y2="377" stroke="#5b6b76" stroke-width="1"/><text x="351.3" y="412" font-size="11" fill="#16232b" text-anchor="middle">log₂ odds ratio — left: mutually exclusive, right: co-occurring</text><text x="8" y="434" font-size="10" fill="#5b6b76">Pairwise co-occurrence within “NSCLC”. Denominators are the patients profiled for BOTH genes, computed per study against that study's own panels — a</text><text x="8" y="448" font-size="10" fill="#5b6b76">pair is never scored on patients whose panel could not have detected it. Two-sided Fisher exact test. q-values are Benjamini–Hochberg across the 15</text><text x="8" y="462" font-size="10" fill="#5b6b76">assessable pairs. Every site returns four counts per pair and nothing else.</text></svg>
