atio — left: mutually exclusive, right: co-occurring</text><text x="8" y="434" font-size="10" fill="#5b6b76">Pairwise co-occurrence within “NSCLC”. Denominators are the patients profiled for BOTH genes, computed per study against that study's own panels — a</text><text x="8" y="448" font-size="10" fill="#5b6b76">pair is never scored on patients whose panel could not have detected it. Two-sided Fisher exact test. q-values are Benjamini–Hochberg across the 15</text><text x="8" y="462" font-size="10" fill="#5b6b76">assessable pairs. Every site returns four counts per pair and nothing else.</text></svg>
