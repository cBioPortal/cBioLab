<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 151" width="100%" role="img" aria-label="Logistic regression — odds ratios" style="max-width:760px;height:auto;display:block;font-family:'IBM Plex Sans',system-ui,sans-serif"><title>Logistic regression — odds ratios</title><rect width="760" height="151" fill="#ffffff"/><text x="617.6" y="14" font-size="10" fill="#5b6b76">OR [95% CI]</text><text x="752" y="14" font-size="10" fill="#5b6b76" text-anchor="end">p</text><rect x="4" y="24" width="752" height="22" fill="#dde4e8" opacity="0.35"/><text x="8" y="38.9" font-size="11" fill="#16232b">APC: Mutated vs Wild Type: Mutated vs Not mutated</text><line x1="294.6" y1="35" x2="522.5" y2="35" stroke="#0072B2" stroke-width="2"/><rect x="404.6" y="31" width="8" height="8" fill="#0072B2"/><text x="617.6" y="38.9" font-size="11" fill="#16232b">0.28 [0.13–0.63]</text><text x="752" y="38.9" font-size="11" fill="#16232b" text-anchor="end" font-weight="600">0.0018</text><line x1="589.9" y1="20" x2="589.9" y2="46" stroke="#5b6b76" stroke-width="1" stroke-dasharray="3 3"/><text x="589.9" y="14" font-size="10" fill="#5b6b76" text-anchor="middle">OR = 1</text><line x1="359" y1="50" x2="359" y2="53" stroke="#5b6b76" stroke-width="1"/><text x="351.7" y="66" font-size="10" fill="#5b6b76">0.2</text><line x1="458.5" y1="50" x2="458.5" y2="53" stroke="#5b6b76" stroke-width="1"/><text x="451.1" y="66" font-size="10" fill="#5b6b76">0.4</text><line x1="516.6" y1="50" x2="516.6" y2="53" stroke="#5b6b76" stroke-width="1"/><text x="509.3" y="66" font-size="10" fill="#5b6b76">0.6</text><line x1="557.9" y1="50" x2="557.9" y2="53" stroke="#5b6b76" stroke-width="1"/><text x="550.5" y="66" font-size="10" fill="#5b6b76">0.8</text><line x1="589.9" y1="50" x2="589.9" y2="53" stroke="#5b6b76" stroke-width="1"/><text x="586.9" y="66" font-size="10" fill="#5b6b76">1</text><line x1="279.455" y1="50" x2="603.594" y2="50" stroke="#5b6b76" stroke-width="1"/><text x="441.5" y="85" font-size="11" fill="#16232b" text-anchor="middle">OR (log scale) — left of 1 is lower, right is higher</text><text x="8" y="105" font-size="10" fill="#5b6b76">Logistic regression on 470 patients, 27 with MSI Type = Instable (1 term). Every other observed value of MSI Type (Do not report, Indeterminate, Stable) was treated</text><text x="8" y="119" font-size="10" fill="#5b6b76">as “not event.” 1 patient from patient-level participants lacked the outcome or a covariate and were excluded. Computed from real per-patient rows within each local</text><text x="8" y="133" font-size="10" fill="#5b6b76">study — not pooled aggregate counts across untrusted remote peers.</text></svg>
