text-anchor="middle">OR (log scale) — left of 1 is lower, right is higher</text><text x="8" y="105" font-size="10" fill="#5b6b76">Logistic regression on 470 patients, 27 with MSI_TYPE = Instable (1 term). Every other observed value of MSI_TYPE (Do not report, Indeterminate, Stable) was</text><text x="8" y="119" font-size="10" fill="#5b6b76">treated as “not event.” 1 patient from patient-level participants lacked the outcome or a covariate and were excluded. Computed from real per-patient rows within</text><text x="8" y="133" font-size="10" fill="#5b6b76">each local study — not pooled aggregate counts across untrusted remote peers.</text></svg>
