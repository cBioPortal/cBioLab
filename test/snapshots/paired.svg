75</text><text x="701.8" y="214.5" font-size="10" fill="#5b6b76" text-anchor="end">67.0%</text><text x="775.1" y="214.5" font-size="10" fill="#5b6b76" text-anchor="end">2,278</text><text x="840.8" y="214.5" font-size="10" fill="#5b6b76" text-anchor="end">0.87</text><text x="854.8" y="214.5" font-size="10" fill="#5b6b76"></text><line x1="66.6" y1="221" x2="66.6" y2="224" stroke="#5b6b76" stroke-width="1"/><text x="63.6" y="237" font-size="10" fill="#5b6b76">0</text><line x1="161.6" y1="221" x2="161.6" y2="224" stroke="#5b6b76" stroke-width="1"/><text x="152.6" y="237" font-size="10" fill="#5b6b76">200</text><line x1="256.7" y1="221" x2="256.7" y2="224" stroke="#5b6b76" stroke-width="1"/><text x="247.7" y="237" font-size="10" fill="#5b6b76">400</text><line x1="351.7" y1="221" x2="351.7" y2="224" stroke="#5b6b76" stroke-width="1"/><text x="342.7" y="237" font-size="10" fill="#5b6b76">600</text><line x1="446.8" y1="221" x2="446.8" y2="224" stroke="#5b6b76" stroke-width="1"/><text x="437.8" y="237" font-size="10" fill="#5b6b76">800</text><line x1="541.8" y1="221" x2="541.8" y2="224" stroke="#5b6b76" stroke-width="1"/><text x="528.4" y="237" font-size="10" fill="#5b6b76">1,000</text><line x1="636.8" y1="221" x2="636.8" y2="224" stroke="#5b6b76" stroke-width="1"/><text x="623.5" y="237" font-size="10" fill="#5b6b76">1,200</text><line x1="66.583" y1="221" x2="636.8399999999999" y2="221" stroke="#5b6b76" stroke-width="1"/><text x="351.7" y="256" font-size="11" fill="#16232b" text-anchor="middle">patients altered on either side</text><text x="8" y="278" font-size="10" fill="#5b6b76">Within patients with samples on both sides, Primary and Metastasis (SAMPLE_TYPE = Primary vs Metastasis; all patients: 2,278 patients), per gene, among those profiled</text><text x="8" y="292" font-size="10" fill="#5b6b76">for it on BOTH sides by each side's own panels: an OncoKB driver (v7.5) on both sides, on the Primary side only, or the Metastasis side only; a patient with several</text><text x="8" y="306" font-size="10" fill="#5b6b76">samples on a side counts as altered there if any is. Both sides are the cohort's own samples, so a cohort that selects one kind of sample has no pairs. Concordance is both</text><text x="8" y="320" font-size="10" fill="#5b6b76">÷ altered anywhere. The exact McNemar test asks whether discordance runs one way; q is Benjamini–Hochberg across the genes of each cohort. A sample's</text><text x="8" y="334" font-size="10" fill="#5b6b76">SAMPLE_TYPE records where the tissue came from, not when it was taken, so Metastasis-only is not the same as &quot;acquired later&quot;; and patients sampled twice are a</text><text x="8" y="348" font-size="10" fill="#5b6b76">selected group, typically with longer or harder disease courses.</text></svg>
