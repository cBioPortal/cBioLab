468.5V489.5H478.2V494.2H485.2V499H496.4V504.3H504.2V509.8H505.3V515.4H553.4V523.8H570V532.1H592.5V540.5H625.8V548.8H637.5V558.9H669.7V568.9H781.6V583.9H920V599" fill="none" stroke="#E69F00" stroke-width="2" stroke-linejoin="round"/><text x="8" y="656" font-size="10" fill="#5b6b76" font-weight="600">Number at risk</text><line x1="8" y1="670" x2="24" y2="670" stroke="#0072B2" stroke-width="2"/><text x="28" y="673.5" font-size="10" fill="#16232b">BRCA2 carriers</text><text x="103.2" y="673.5" font-size="10" fill="#5b6b76"><title>BRCA2 carriers: 5 at risk at 0 months</title>5</text><text x="244.7" y="673.5" font-size="10" fill="#5b6b76"><title>BRCA2 carriers: 2 at risk at 12 months</title>2</text><text x="386.3" y="673.5" font-size="10" fill="#5b6b76"><title>BRCA2 carriers: 1 at risk at 24 months</title>1</text><text x="527.8" y="673.5" font-size="10" fill="#5b6b76"><title>BRCA2 carriers: 0 at risk at 36 months</title>0</text><text x="669.4" y="673.5" font-size="10" fill="#5b6b76"><title>BRCA2 carriers: 0 at risk at 48 months</title>0</text><text x="810.9" y="673.5" font-size="10" fill="#5b6b76"><title>BRCA2 carriers: 0 at risk at 60 months</title>0</text><line x1="8" y1="686" x2="24" y2="686" stroke="#E69F00" stroke-width="2"/><text x="28" y="689.5" font-size="10" fill="#16232b">non-carriers</text><text x="102.2" y="689.5" font-size="10" fill="#5b6b76"><title>non-carriers: 123 at risk at 0 months</title>123</text><text x="241.7" y="689.5" font-size="10" fill="#5b6b76"><title>non-carriers: 89 at risk at 12 months</title>89</text><text x="383.3" y="689.5" font-size="10" fill="#5b6b76"><title>non-carriers: 46 at risk at 24 months</title>46</text><text x="524.8" y="689.5" font-size="10" fill="#5b6b76"><title>non-carriers: 11 at risk at 36 months</title>11</text><text x="669.4" y="689.5" font-size="10" fill="#5b6b76"><title>non-carriers: 3 at risk at 48 months</title>3</text><text x="810.9" y="689.5" font-size="10" fill="#5b6b76"><title>non-carriers: 1 at risk at 60 months</title>1</text><line x1="8" y1="710" x2="26" y2="710" stroke="#0072B2" stroke-width="2"/><text x="31" y="713.9" font-size="11" fill="#16232b">BRCA2 carriers<tspan dx="6" fill="#5b6b76">n = 5 · 3 deaths · median 12.3 mo</tspan></text><line x1="476" y1="710" x2="494" y2="710" stroke="#E69F00" stroke-width="2"/><text x="499" y="713.9" font-size="11" fill="#16232b">non-carriers<tspan dx="6" fill="#5b6b76">n = 123 · 73 deaths · median 28.1 mo</tspan></text><text x="8" y="739" font-size="11" fill="#16232b">Log-rank χ² = 0.956 (1 df) · p = 0.33</text><text x="8" y="760" font-size="10" fill="#5b6b76">LOH: not assessed. Carriers are patients with a mutation the study marks GERMLINE (mutation status, case-insensitive) in the gene, counted per patient over their</text><text x="8" y="774" font-size="10" fill="#5b6b76">samples in the cohort and only among the patients sequenced for the gene (a tumour mutation panel listing it, or whole-exome); none fell outside a panel. A study reports</text><text x="8" y="788" font-size="10" fill="#5b6b76">germline variants only for the patients it analysed and consented for it, and the warehouse cannot tell a patient tested and negative from one never tested, so the carrier</text><text x="8" y="802" font-size="10" fill="#5b6b76">share is of patients sequenced, not of patients germline-tested: a lower bound where germline testing was partial. A somatic second hit in a carrier is another mutation in</text><text x="8" y="816" font-size="10" fill="#5b6b76">the same gene that is not germline (any called status but GERMLINE; uncalled and off-panel calls excluded) or a deep deletion (copy number −2, among patients profiled</text><text x="8" y="830" font-size="10" fill="#5b6b76">for copy number). Loss of heterozygosity — the commonest second hit — needs allele-specific copy number and is not assessed; a deep deletion in a carrier is rare, since</text><text x="8" y="844" font-size="10" fill="#5b6b76">it removes the germline allele too. So the second-hit rate is a floor. Non-carriers' rate is the same somatic definition among the sequenced patients without a germline</text><text x="8" y="858" font-size="10" fill="#5b6b76">call; Fisher's exact test of carriers' against non-carriers' rate per gene, Benjamini–Hochberg over the genes of each cohort. Germline calls are not pathogenicity-filtered</text><text x="8" y="872" font-size="10" fill="#5b6b76">here: whatever the study deposited as germline is counted. Overall survival of the patients sequenced for BRCA2, carriers against non-carriers, from OS_MONTHS /</text><text x="8" y="886" font-size="10" fill="#5b6b76">OS_STATUS (Kaplan–Meier, log-rank); not corrected for left truncation or for cancer type and stage.</text></svg>
