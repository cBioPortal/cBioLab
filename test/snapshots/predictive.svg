="7" height="7" fill="#0072B2"/><text x="454.3" y="77.5" font-size="10" fill="#16232b">1.41 [1.26–1.57]</text><line x1="349.5" y1="85" x2="395.7" y2="85" stroke="#D55E00" stroke-width="2"/><rect x="369.1" y="81.5" width="7" height="7" fill="#D55E00"/><text x="454.3" y="88.5" font-size="10" fill="#16232b">1.66 [1.47–1.89]</text><text x="752" y="82.9" font-size="11" fill="#5b6b76" text-anchor="end">0.051 · q 0.10</text><rect x="4" y="94" width="752" height="30" fill="#dde4e8" opacity="0.35"/><text x="8" y="107" font-size="11" fill="#16232b" font-weight="600">KRAS</text><text x="8" y="119" font-size="10" fill="#5b6b76"><title>mutated 981/2,666 exposed · 1,213/5,143 not</title>mutated 981/2,666 exposed · 1,213/5,14…</text><line x1="260.6" y1="104" x2="295.6" y2="104" stroke="#0072B2" stroke-width="2"/><rect x="274.6" y="100.5" width="7" height="7" fill="#0072B2"/><text x="454.3" y="107.5" font-size="10" fill="#16232b">0.99 [0.90–1.09]</text><line x1="238.9" y1="115" x2="276.3" y2="115" stroke="#D55E00" stroke-width="2"/><rect x="254.1" y="111.5" width="7" height="7" fill="#D55E00"/><text x="454.3" y="118.5" font-size="10" fill="#16232b">0.89 [0.80–0.98]</text><text x="752" y="112.9" font-size="11" fill="#5b6b76" text-anchor="end">0.12 · q 0.12</text><text x="8" y="137" font-size="11" fill="#16232b" font-weight="600">TP53</text><text x="8" y="149" font-size="10" fill="#5b6b76"><title>mutated 1,602/2,666 exposed · 2,418/5,143 not</title>mutated 1,602/2,666 exposed · 2,418/5,…</text><line x1="265.6" y1="134" x2="299.8" y2="134" stroke="#0072B2" stroke-width="2"/><rect x="279.2" y="130.5" width="7" height="7" fill="#0072B2"/><text x="454.3" y="137.5" font-size="10" fill="#16232b">1.02 [0.93–1.12]</text><line x1="363.2" y1="145" x2="394.5" y2="145" stroke="#D55E00" stroke-width="2"/><rect x="375.3" y="141.5" width="7" height="7" fill="#D55E00"/><text x="454.3" y="148.5" font-size="10" fill="#16232b">1.72 [1.58–1.88]</text><text x="752" y="142.9" font-size="11" fill="#16232b" text-anchor="end" font-weight="600">4.5e-16 · q 2.7e-15</text><rect x="4" y="154" width="752" height="30" fill="#dde4e8" opacity="0.35"/><text x="8" y="167" font-size="11" fill="#16232b" font-weight="600">EGFR</text><text x="8" y="179" font-size="10" fill="#5b6b76"><title>mutated 283/2,666 exposed · 1,610/5,143 not</title>mutated 283/2,666 exposed · 1,610/5,14…</text><line x1="261" y1="164" x2="312.1" y2="164" stroke="#0072B2" stroke-width="2"/><rect x="283" y="160.5" width="7" height="7" fill="#0072B2"/><text x="454.3" y="167.5" font-size="10" fill="#16232b">1.04 [0.90–1.20]</text><line x1="242.9" y1="175" x2="276.6" y2="175" stroke="#D55E00" stroke-width="2"/><rect x="256.3" y="171.5" width="7" height="7" fill="#D55E00"/><text x="454.3" y="178.5" font-size="10" fill="#16232b">0.90 [0.82–0.99]</text><text x="752" y="172.9" font-size="11" fill="#5b6b76" text-anchor="end">0.087 · q 0.10</text><text x="8" y="197" font-size="11" fill="#16232b" font-weight="600">SMARCA4</text><text x="8" y="209" font-size="10" fill="#5b6b76"><title>mutated 283/2,666 exposed · 297/5,143 not</title>mutated 283/2,666 exposed · 297/5,143…</text><line x1="275.9" y1="194" x2="329.2" y2="194" stroke="#0072B2" stroke-width="2"/><rect x="299.1" y="190.5" width="7" height="7" fill="#0072B2"/><text x="454.3" y="197.5" font-size="10" fill="#16232b">1.14 [0.98–1.31]</text><line x1="366" y1="205" x2="422.8" y2="205" stroke="#D55E00" stroke-width="2"/><rect x="390.9" y="201.5" width="7" height="7" fill="#D55E00"/><text x="454.3" y="208.5" font-size="10" fill="#16232b">1.88 [1.61–2.19]</text><text x="752" y="202.9" font-size="11" fill="#16232b" text-anchor="end" font-weight="600">3.8e-6 · q 1.1e-5</text><line x1="279.3" y1="32" x2="279.3" y2="214" stroke="#5b6b76" stroke-width="1" stroke-dasharray="3 3"/><line x1="279.3" y1="218" x2="279.3" y2="221" stroke="#5b6b76" stroke-width="1"/><text x="276.3" y="234" font-size="10" fill="#5b6b76">1</text><line x1="353.6" y1="218" x2="353.6" y2="221" stroke="#5b6b76" stroke-width="1"/><text x="346.2" y="234" font-size="10" fill="#5b6b76">1.5</text><line x1="406.2" y1="218" x2="406.2" y2="221" stroke="#5b6b76" stroke-width="1"/><text x="403.2" y="234" font-size="10" fill="#5b6b76">2</text><line x1="219.6" y1="218" x2="440.286" y2="218" stroke="#5b6b76" stroke-width="1"/><text x="329.9" y="253" font-size="11" fill="#16232b" text-anchor="middle"><title>HR, mutated vs wild-type (log scale) — left of 1 is lower, right is higher</title>HR, mutated vs wild-type (log scale) — left…</text><text x="8" y="273" font-size="10" fill="#5b6b76">7,809 patients (2,666 exposed to Treatment [SUBTYPE=Immuno]), 3,975 deaths or events on OS. Each row: the mutated against the wild-type among the exposed</text><text x="8" y="287" font-size="10" fill="#5b6b76">(upper marker) and the unexposed (lower marker); the right column is the gene × exposure interaction. STK11 interaction HR 1.16, KEAP1 interaction HR 0.85, KRAS</text><text x="8" y="301" font-size="10" fill="#5b6b76">interaction HR 1.12, TP53 interaction HR 0.59, EGFR interaction HR 1.16, SMARCA4 interaction HR 0.61. For each gene, a Cox model of OS (Efron ties) on the gene</text><text x="8" y="315" font-size="10" fill="#5b6b76">(any mutation), exposure to Treatment [SUBTYPE=Immuno] (any such timeline event) and their product. The gene's hazard ratio among the exposed and among the</text><text x="8" y="329" font-size="10" fill="#5b6b76">unexposed are the same model's two contrasts (the interaction coded both ways), so they share its estimates; the interaction HR is their ratio, and its p asks whether</text><text x="8" y="343" font-size="10" fill="#5b6b76">the gene predicts benefit rather than merely prognosis. q is Benjamini–Hochberg over the 6 genes fitted. Each gene is fitted over the patients whose panel covers it: a</text><text x="8" y="357" font-size="10" fill="#5b6b76">patient not profiled for a gene is left out of that gene's fit, never counted as wild-type. BIASES: exposure is defined from the whole record, after the clock's start — a</text><text x="8" y="371" font-size="10" fill="#5b6b76">patient must survive long enough to be treated, so the exposed group is credited with time before their treatment (immortal-time bias), and treatment was not</text><text x="8" y="385" font-size="10" fill="#5b6b76">randomised but chosen for patients by their condition (confounding by indication). Both distort the exposure's own effect; the interaction is less exposed to them but</text><text x="8" y="399" font-size="10" fill="#5b6b76">not immune, and an interaction found here is a hypothesis for a randomised or emulated-trial design, not evidence of benefit. Left out: 0 patients with no mutation</text><text x="8" y="413" font-size="10" fill="#5b6b76">panel on record. Strongest interaction: TP53 (p 4.5e-16, q 2.7e-15). Computed from per-patient rows inside each patient-level study.</text></svg>
