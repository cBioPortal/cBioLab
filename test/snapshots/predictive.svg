roke="#5b6b76" stroke-width="1"/><text x="346.7" y="234" font-size="10" fill="#5b6b76">1.5</text><line x1="406.6" y1="218" x2="406.6" y2="221" stroke="#5b6b76" stroke-width="1"/><text x="403.6" y="234" font-size="10" fill="#5b6b76">2</text><line x1="219.6" y1="218" x2="440.286" y2="218" stroke="#5b6b76" stroke-width="1"/><text x="329.9" y="253" font-size="11" fill="#16232b" text-anchor="middle"><title>HR, mutated vs wild-type (log scale) — left of 1 is lower, right is higher</title>HR, mutated vs wild-type (log scale) — left…</text><text x="8" y="273" font-size="10" fill="#5b6b76">7,809 patients (2,666 exposed to Treatment [SUBTYPE=Immuno]), 3,975 deaths or events on OS. Each row: the mutated against the wild-type among the exposed</text><text x="8" y="287" font-size="10" fill="#5b6b76">(upper marker) and the unexposed (lower marker); the right column is the gene × exposure interaction. STK11 interaction HR 1.16, KEAP1 interaction HR 0.84, KRAS</text><text x="8" y="301" font-size="10" fill="#5b6b76">interaction HR 1.14, TP53 interaction HR 0.58, EGFR interaction HR 1.17, SMARCA4 interaction HR 0.61. For each gene, a Cox model of OS (Efron ties) on the gene</text><text x="8" y="315" font-size="10" fill="#5b6b76">(any mutation), exposure to Treatment [SUBTYPE=Immuno] (any such timeline event) and their product. The gene's hazard ratio among the exposed and among the</text><text x="8" y="329" font-size="10" fill="#5b6b76">unexposed are the same model's two contrasts (the interaction coded both ways), so they share its estimates; the interaction HR is their ratio, and its p asks whether</text><text x="8" y="343" font-size="10" fill="#5b6b76">the gene predicts benefit rather than merely prognosis. q is Benjamini–Hochberg over the 6 genes fitted. Each gene is fitted over the patients whose panel covers it: a</text><text x="8" y="357" font-size="10" fill="#5b6b76">patient not profiled for a gene is left out of that gene's fit, never counted as wild-type. BIASES: exposure is defined from the whole record, after the clock's start — a</text><text x="8" y="371" font-size="10" fill="#5b6b76">patient must survive long enough to be treated, so the exposed group is credited with time before their treatment (immortal-time bias), and treatment was not</text><text x="8" y="385" font-size="10" fill="#5b6b76">randomised but chosen for patients by their condition (confounding by indication). Both distort the exposure's own effect; the interaction is less exposed to them but</text><text x="8" y="399" font-size="10" fill="#5b6b76">not immune, and an interaction found here is a hypothesis for a randomised or emulated-trial design, not evidence of benefit. Left out: 0 patients with no mutation</text><text x="8" y="413" font-size="10" fill="#5b6b76">panel on record. Strongest interaction: TP53 (p 9.4e-17, q 5.7e-16). Computed from per-patient rows inside each patient-level study.</text></svg>
