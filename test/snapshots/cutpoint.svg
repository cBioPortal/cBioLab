font-size="10" fill="#5b6b76">1,661 patients with a value, 832 events; 0 with a survival time but no value. 3 CANCER_TYPE values (133 patients) not scanned. The cut was chosen from</text><text x="8" y="922" font-size="10" fill="#5b6b76">these patients to separate their OS as much as possible, so the split is optimistic in-sample: its naive log-rank p (9.5e-15) ignores the search and overstates</text><text x="8" y="936" font-size="10" fill="#5b6b76">the evidence, and the cut needs validation in an independent cohort before it is used. Scanned: 73 candidate cuts — the distinct values of</text><text x="8" y="950" font-size="10" fill="#5b6b76">TMB_NONSYNONYMOUS leaving between 10% and 90% of patients at or below them (at most 100, evenly spaced) — by the maximally selected</text><text x="8" y="964" font-size="10" fill="#5b6b76">standardized log-rank statistic (Lausen &amp; Schumacher; R maxstat). The corrected p is from 1000 permutations of the marker over the patients (seed 1): the</text><text x="8" y="978" font-size="10" fill="#5b6b76">share whose own best cut does as well. High is TMB_NONSYNONYMOUS &gt; 14.42 (19.4% of patients). TMB_NONSYNONYMOUS is the patient's value, or for a</text><text x="8" y="992" font-size="10" fill="#5b6b76">sample attribute the value of the patient's first cohort sample by sample id; 0 patients with a survival time and no numeric value are left out. The status '1:…'</text><text x="8" y="1006" font-size="10" fill="#5b6b76">is an event, anything else censored; times from each study's own baseline. Per CANCER_TYPE: the largest 8 values with at least 100 patients each get their</text><text x="8" y="1020" font-size="10" fill="#5b6b76">own scan and permutation test (same seed); 3 other values (133 patients) are not scanned. Each stratum's cut is as optimistic as the overall one. Computed</text><text x="8" y="1034" font-size="10" fill="#5b6b76">from per-patient rows inside each patient-level study.</text></svg>
