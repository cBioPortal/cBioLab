" font-size="10" fill="#16232b" text-anchor="end">1,668</text><text x="222.2" y="397.5" font-size="10" fill="#16232b" font-weight="600">1.2e-24 co-occurring</text><text x="332.5" y="397.5" font-size="10" fill="#16232b">2.8e-74 co-occurring</text><rect x="4" y="403" width="439.78000000000003" height="18" fill="#dde4e8" opacity="0.3"/><text x="8" y="415.5" font-size="10" fill="#16232b">KRAS / TP53</text><text x="109.7" y="415.5" font-size="10" fill="#16232b" text-anchor="end">184</text><text x="163.3" y="415.5" font-size="10" fill="#16232b" text-anchor="end">314</text><text x="210.2" y="415.5" font-size="10" fill="#16232b" text-anchor="end">1,668</text><text x="222.2" y="415.5" font-size="10" fill="#16232b" font-weight="600">1.5e-20 exclusive</text><text x="332.5" y="415.5" font-size="10" fill="#16232b">7.3e-16 exclusive</text><text x="8" y="433.5" font-size="10" fill="#16232b">STK11 / TP53</text><text x="109.7" y="433.5" font-size="10" fill="#16232b" text-anchor="end">125</text><text x="163.3" y="433.5" font-size="10" fill="#16232b" text-anchor="end">195</text><text x="210.2" y="433.5" font-size="10" fill="#16232b" text-anchor="end">1,668</text><text x="222.2" y="433.5" font-size="10" fill="#16232b" font-weight="600">3.9e-9 exclusive</text><text x="332.5" y="433.5" font-size="10" fill="#16232b">7.2e-5 exclusive</text><rect x="4" y="439" width="439.78000000000003" height="18" fill="#dde4e8" opacity="0.3"/><text x="8" y="451.5" font-size="10" fill="#16232b">EGFR / BRAF</text><text x="109.7" y="451.5" font-size="10" fill="#16232b" text-anchor="end">14</text><text x="163.3" y="451.5" font-size="10" fill="#16232b" text-anchor="end">39.7</text><text x="210.2" y="451.5" font-size="10" fill="#16232b" text-anchor="end">1,668</text><text x="222.2" y="451.5" font-size="10" fill="#16232b" font-weight="600">2.5e-6 exclusive</text><text x="332.5" y="451.5" font-size="10" fill="#16232b">0.006 exclusive</text><text x="8" y="469.5" font-size="10" fill="#16232b">KRAS / BRAF</text><text x="109.7" y="469.5" font-size="10" fill="#16232b" text-anchor="end">15</text><text x="163.3" y="469.5" font-size="10" fill="#16232b" text-anchor="end">41.4</text><text x="210.2" y="469.5" font-size="10" fill="#16232b" text-anchor="end">1,668</text><text x="222.2" y="469.5" font-size="10" fill="#16232b" font-weight="600">2.5e-6 exclusive</text><text x="332.5" y="469.5" font-size="10" fill="#16232b">0.0053 exclusive</text><rect x="4" y="475" width="439.78000000000003" height="18" fill="#dde4e8" opacity="0.3"/><text x="8" y="487.5" font-size="10" fill="#16232b">KEAP1 / TP53</text><text x="109.7" y="487.5" font-size="10" fill="#16232b" text-anchor="end">140</text><text x="163.3" y="487.5" font-size="10" fill="#16232b" text-anchor="end">178</text><text x="210.2" y="487.5" font-size="10" fill="#16232b" text-anchor="end">1,668</text><text x="222.2" y="487.5" font-size="10" fill="#16232b" font-weight="600">1e-3 exclusive</text><text x="332.5" y="487.5" font-size="10" fill="#16232b">0.73 exclusive</text><text x="8" y="505.5" font-size="10" fill="#16232b">BRAF / STK11</text><text x="109.7" y="505.5" font-size="10" fill="#16232b" text-anchor="end">14</text><text x="163.3" y="505.5" font-size="10" fill="#16232b" text-anchor="end">27.1</text><text x="210.2" y="505.5" font-size="10" fill="#16232b" text-anchor="end">1,668</text><text x="222.2" y="505.5" font-size="10" fill="#16232b" font-weight="600">0.0056 exclusive</text><text x="332.5" y="505.5" font-size="10" fill="#16232b">0.62 exclusive</text><rect x="4" y="511" width="439.78000000000003" height="18" fill="#dde4e8" opacity="0.3"/><text x="8" y="523.5" font-size="10" fill="#16232b">KRAS / STK11</text><text x="109.7" y="523.5" font-size="10" fill="#16232b" text-anchor="end">141</text><text x="163.3" y="523.5" font-size="10" fill="#16232b" text-anchor="end">112</text><text x="210.2" y="523.5" font-size="10" fill="#16232b" text-anchor="end">1,668</text><text x="222.2" y="523.5" font-size="10" fill="#16232b" font-weight="600">0.017 co-occurring</text><text x="332.5" y="523.5" font-size="10" fill="#16232b">1.8e-17 co-occurring</text><text x="8" y="541.5" font-size="10" fill="#16232b">BRAF / KEAP1</text><text x="109.7" y="541.5" font-size="10" fill="#5b6b76" text-anchor="end">18</text><text x="163.3" y="541.5" font-size="10" fill="#5b6b76" text-anchor="end">25</text><text x="210.2" y="541.5" font-size="10" fill="#5b6b76" text-anchor="end">1,668</text><text x="222.2" y="541.5" font-size="10" fill="#5b6b76">0.11 exclusive</text><text x="332.5" y="541.5" font-size="10" fill="#5b6b76">0.49 co-occurring</text><text x="8" y="567" font-size="10" fill="#5b6b76">Within “NSCLC”, over its 1,668 samples with a gene panel (a sample without a panel record is left out, never read as wild-type), counting any alteration (mutation,</text><text x="8" y="581" font-size="10" fill="#5b6b76">amplification or deep deletion, structural variant). DISCOVER's background gives each sample and gene a probability of alteration, σ(a_sample + b_gene), fitted so that</text><text x="8" y="595" font-size="10" fill="#5b6b76">every sample's expected number of altered genes is its observed burden and every gene's expected number of altered samples its observed count — over the whole</text><text x="8" y="609" font-size="10" fill="#5b6b76">altered-gene matrix (410 genes, each sample's own panels: a gene off a sample's panel has no probability there); the fit matched every margin to within 0.01% in 3</text><text x="8" y="623" font-size="10" fill="#5b6b76">rounds. For a pair, the number of samples altered in both under independence given those probabilities is Poisson-binomial with p_i = p_iA·p_iB, over the samples</text><text x="8" y="637" font-size="10" fill="#5b6b76">profiled for both; exclusivity is its lower tail at the observed count, co-occurrence its upper tail, each Benjamini–Hochberg across the 15 pairs, all exact. Beside it, the</text><text x="8" y="651" font-size="10" fill="#5b6b76">plain two-sided Fisher test on the same samples, which assumes every tumour is equally likely to carry each alteration — heavily altered tumours then manufacture</text><text x="8" y="665" font-size="10" fill="#5b6b76">co-occurrence and lightly altered ones exclusivity: here 9 pairs are exclusive at DISCOVER q &lt; 0.05 against 7 by Fisher. Exclusivity is a pattern, not a mechanism:</text><text x="8" y="679" font-size="10" fill="#5b6b76">synthetic lethality, redundant pathway hits, and subtypes with different drivers (the confounder stratifying removes, when the strata are the right ones) all produce it.</text></svg>
