ext x="376" y="105" font-size="11" fill="#5b6b76">CANCER_TYPE_DETAILED in [Lung Adenocarcinoma]</text><text x="376" y="121" font-size="12" font-weight="600" fill="#16232b">5,957<tspan dx="5" font-size="10" font-weight="400" fill="#5b6b76">(23.9% of base)</tspan></text></g><line x1="392" y1="130" x2="392" y2="152" stroke="#5b6b76" stroke-width="1"/><path d="M 388 147 L 392 153 L 396 147" fill="none" stroke="#5b6b76" stroke-width="1"/><text x="402" y="145.5" font-size="10" fill="#5b6b76">−1,973 excluded</text><g><rect x="368" y="154" width="340" height="42" rx="4" fill="#ffffff" stroke="#E69F00" stroke-width="2"/><text x="376" y="171" font-size="11" fill="#5b6b76">NOT OQL[KRAS]</text><text x="376" y="187" font-size="12" font-weight="600" fill="#16232b">3,984<tspan dx="5" font-size="10" font-weight="400" fill="#5b6b76">(16.0% of base)</tspan></text></g><text x="8" y="346" font-size="10" fill="#5b6b76">Each step counts the patients left after ANDing that clause onto every clause above it, in the order the cohort lists them. The order changes the path, never the final</text><text x="8" y="360" font-size="10" fill="#5b6b76">count: reorder the clauses to see a different attrition sequence. Each view further drops patients who lack its own data (survival without follow-up, genes never</text><text x="8" y="374" font-size="10" fill="#5b6b76">profiled), and says how many in its own caption.</text></svg>
