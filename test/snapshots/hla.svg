t-size="11" fill="#16232b" text-anchor="middle">Months (OS)</text><path d="M101.6 30H101.6V30H106.9V34.3H108V38.5H111.5V47H113.3V55.5H115V59.8H118V64H118.7V72.6H119.6V81.1H123.3V89.6H126.6V98.1H128.1V102.3H132V110.9H132.9V115.1H137.2V123.6H139.5V127.9H144.7V132.3H155.9V137.2H156.8V142.1H167.4V147H171.9V151.9H178.7V156.7H181.7V162H212.9V168.2H218.4V174.3H438" fill="none" stroke="#0072B2" stroke-width="2" stroke-linejoin="round"/><path d="M101.6 30H101.6V30H105.6V33.7H107.5V34.9H109.3V37.3H109.9V38.6H110.5V42.2H111.2V45.9H112.1V48.4H113.3V50.8H113.9V54.5H115.2V55.8H116V58.3H116.7V59.5H117.8V63.2H118.6V65.7H120V68.1H120.6V71.8H121.5V73.1H122.3V74.3H122.9V76.8H124.4V79.3H125.7V83H127.2V84.2H128.1V85.4H129.4V87.9H131.2V91.6H132.5V92.8H133.7V95.3H135.7V97.8H136.3V100.3H138.7V101.5H139.6V104H140.7V106.5H144.2V107.7H146.5V109H149.9V110.2H151.3V111.5H152.8V114.1H154V115.3H154.6V117.9H156V119.2H159.9V120.5H164.6V121.8H165.8V123.1H168.1V124.4H172.3V125.7H172.9V127.1H174.1V128.4H176V129.7H178.9V131.1H182.3V132.4H187.4V133.9H188.3V136.8H190.5V138.3H196.5V139.9H197.7V141.6H199V143.3H202.7V144.9H211.8V146.7H212.5V150.3H215V152.2H215.7V154H216.8V157.8H225.1V160.1H225.8V162.5H241.9V165.1H259.5V168.2H276.8V171.6H438V230" fill="none" stroke="#E69F00" stroke-width="2" stroke-linejoin="round"/><text x="8" y="287" font-size="10" fill="#5b6b76" font-weight="600">Number at risk</text><line x1="8" y1="301" x2="24" y2="301" stroke="#0072B2" stroke-width="2"/><text x="28" y="304.5" font-size="10" fill="#16232b"><title>homozygous at ≥1 locus</title>homozygou…</text><text x="97.6" y="304.5" font-size="10" fill="#5b6b76"><title>homozygous at ≥1 locus: 47 at risk at 0 months</title>47</text><text x="180.9" y="304.5" font-size="10" fill="#5b6b76"><title>homozygous at ≥1 locus: 13 at risk at 24 months</title>13</text><text x="269.3" y="304.5" font-size="10" fill="#5b6b76"><title>homozygous at ≥1 locus: 4 at risk at 48 months</title>4</text><text x="354.6" y="304.5" font-size="10" fill="#5b6b76"><title>homozygous at ≥1 locus: 1 at risk at 72 months</title>1</text><line x1="8" y1="317" x2="24" y2="317" stroke="#E69F00" stroke-width="2"/><text x="28" y="320.5" font-size="10" fill="#16232b"><title>heterozygous at all</title>heterozygo…</text><text x="97.6" y="320.5" font-size="10" fill="#5b6b76"><title>heterozygous at all: 164 at risk at 0 months</title>164</text><text x="180.9" y="320.5" font-size="10" fill="#5b6b76"><title>heterozygous at all: 67 at risk at 24 months</title>67</text><text x="266.3" y="320.5" font-size="10" fill="#5b6b76"><title>heterozygous at all: 18 at risk at 48 months</title>18</text><text x="354.6" y="320.5" font-size="10" fill="#5b6b76"><title>heterozygous at all: 6 at risk at 72 months</title>6</text><line x1="8" y1="341" x2="26" y2="341" stroke="#0072B2" stroke-width="2"/><text x="31" y="344.9" font-size="11" fill="#16232b">homozygous at ≥1 locus<tspan dx="6" fill="#5b6b76">median 12.1 mo · n = 47 · 32 events</tspan></text><line x1="8" y1="359" x2="26" y2="359" stroke="#E69F00" stroke-width="2"/><text x="31" y="362.9" font-size="11" fill="#16232b">heterozygous at all<tspan dx="6" fill="#5b6b76">median 21.7 mo · n = 164 · 103 events</tspan></text><text x="8" y="385" font-size="10" fill="#16232b">log-rank p = 0.33 (stratified by study) · homozygous at ≥1 locus vs not: HR 1.22 [95% CI</text><text x="8" y="400" font-size="10" fill="#16232b">0.82–1.82], p = 0.33 (n = 211)</text></g><g transform="translate(482 122)"><text x="8" y="10" font-size="10" fill="#5b6b76">OS by HLA LOH not drawn: no patient here has an HLA LOH call with the endpoint</text></g><text x="8" y="551" font-size="10" fill="#5b6b76">Left out of the survival analysis (OS_MONTHS / OS_STATUS), as on cBioPortal — a patient enters only with both a status and a time of at least 0, so a missing status is</text><text x="8" y="565" font-size="10" fill="#5b6b76">never read as censored: “melanoma on checkpoint blockade”: 1 patient with a status but no usable time. A locus is homozygous when its two alleles match at the protein</text><text x="8" y="579" font-size="10" fill="#5b6b76">level (2 fields, e.g. A*02:01); homozygosity is counted over patients typed at all three class I loci (HLA-A, -B, -C). melanoma on checkpoint blockade: 212 patients fully</text><text x="8" y="593" font-size="10" fill="#5b6b76">typed of 212 patients, 22.2% homozygous at ≥1 locus; HLA LOH in 0 patients of 0 with a call (—). HLA LOH is any of</text><text x="8" y="607" font-size="10" fill="#5b6b76">HLA_A1_LOH/HLA_A2_LOH/HLA_B1_LOH/HLA_B2_LOH/HLA_C1_LOH/HLA_C2_LOH/HLA_LOH = Loss/Yes/LOH/True in any of the patient's samples in the cohort; a</text><text x="8" y="621" font-size="10" fill="#5b6b76">patient with no call in any of them is left out of that split, and a homozygous locus cannot show LOH (LOHHLA calls only heterozygous loci), so the LOH split is not</text><text x="8" y="635" font-size="10" fill="#5b6b76">independent of the genotype. OS is as each study records it, from its own origin, which is a checkpoint-blockade start only in a study of treated patients that measures</text><text x="8" y="649" font-size="10" fill="#5b6b76">from it (the melanoma immunotherapy studies do; MSK-IMPACT measures from diagnosis or sequencing). Chowell et al. report worse survival with homozygosity in</text><text x="8" y="663" font-size="10" fill="#5b6b76">patients treated with checkpoint blockade, so in a cohort not restricted to them this reads prognosis, not response. Hazard ratios are Cox (Efron ties), exposed against</text><text x="8" y="677" font-size="10" fill="#5b6b76">not, stratified by study, with the log-rank test stratified the same way; no covariates: the HR is unadjusted, and tumour mutational burden and cancer type are known to</text><text x="8" y="691" font-size="10" fill="#5b6b76">confound it. HLA supertypes and evolutionary divergence (HED) are not computed. Pooled across 3 studies whose typing methods and resolutions differ. Computed from</text><text x="8" y="705" font-size="10" fill="#5b6b76">per-patient rows inside each patient-level study.</text></svg>
