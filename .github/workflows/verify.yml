# Jobs run side by side: lint (ESLint, knip, ruff; no secrets), the gate as three lanes, the
# planted-bug check, and the report-only duplication, coverage and security reports.
#
# The whole gate, on every pull request and every push to master, is scripts/gate.sh, split into the
# lanes it names: `local` (unit tests, the stores' Postgres tests, the planted sharing bugs, the
# Python port's conformance; no secrets), `warehouse` (the counts against cBioPortal, the cohort
# logic, the pooled paths, the gallery examples and their method scripts, the denominator, facet,
# value-folding and splitBy checks) and `e2e` (the build, then the browser suite and federation
# against it). The planted-bug check follows the warehouse lane rather than running beside it, so
# no more than two jobs query the warehouse at once, each with its ClickHouse concurrency halved.
# The report /verification displays (docs/verification/*.json) is kept as this run's
# verification-report artifact, merged from the jobs that write it.
#
# Needs these repository secrets: the warehouse's read-only login (CLICKHOUSE_URL, CLICKHOUSE_USER,
# CLICKHOUSE_PASSWORD, CLICKHOUSE_DB) and, for the federation checks, the second instance's
# (CLICKHOUSE2_URL, _USER, _PASSWORD, _DB, _LABEL; leave them unset to run without one). The warehouse
# must accept connections from GitHub's runners. Network access to www.cbioportal.org is required.
name: Verify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Its own job, so a pull request shows lint as a check of its own, and in a couple of minutes
  # rather than after the gate's build and e2e.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Python venv with ruff
        run: python3 -m venv python/.venv && python/.venv/bin/pip install -q -e 'python[dev]'

      - name: ESLint, knip, ruff
        run: npm run lint

  gate-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Gate, local lane (unit, Postgres, planted sharing bugs, Python port)
        run: scripts/gate.sh local

  gate-warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # each check writes its part of the report to a folder that starts empty, so the artifact holds
      # only what this run wrote (docs/verification/ keeps the copy saved with the code, which the
      # build reads); a stage that never ran leaves no file
      RECORD: "1"
      REPORT_DIR: ${{ github.workspace }}/verification-report
      CLICKHOUSE_MAX_INFLIGHT: "4"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # the method scripts run their Python through uv, with the versions lib/method-notebook.ts pins;
      # unpruned, the cache keeps the wheels they install
      - uses: astral-sh/setup-uv@v6
        with:
          cache-dependency-glob: lib/method-notebook.ts
          prune-cache: false

      - run: npm ci

      # every script reads its credentials with `node --env-file=.env.local`
      - &env-local
        name: Write .env.local from secrets
        env:
          CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB }}
          CLICKHOUSE2_URL: ${{ secrets.CLICKHOUSE2_URL }}
          CLICKHOUSE2_USER: ${{ secrets.CLICKHOUSE2_USER }}
          CLICKHOUSE2_PASSWORD: ${{ secrets.CLICKHOUSE2_PASSWORD }}
          CLICKHOUSE2_DB: ${{ secrets.CLICKHOUSE2_DB }}
          CLICKHOUSE2_LABEL: ${{ secrets.CLICKHOUSE2_LABEL }}
        run: |
          if [ -z "$CLICKHOUSE_URL" ]; then
            echo "::error::The CLICKHOUSE_* repository secrets are not set; the gate needs the warehouse."
            exit 1
          fi
          umask 077
          for k in CLICKHOUSE_URL CLICKHOUSE_USER CLICKHOUSE_PASSWORD CLICKHOUSE_DB \
                   CLICKHOUSE2_URL CLICKHOUSE2_USER CLICKHOUSE2_PASSWORD CLICKHOUSE2_DB CLICKHOUSE2_LABEL; do
            [ -n "${!k}" ] && printf '%s=%s\n' "$k" "${!k}" >> .env.local
          done
          true

      - name: Gate, warehouse lane (cBioPortal, cohort logic, pooled paths, examples, method scripts, Explore checks)
        run: scripts/gate.sh warehouse

      - name: Keep this lane's part of the verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report-warehouse
          path: verification-report/
          if-no-files-found: warn

  gate-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Install Chromium for the e2e suite
        run: npx playwright install --with-deps chromium

      - *env-local

      - name: Gate, e2e lane (build, browser suite, federation)
        run: scripts/gate.sh e2e

      - name: Keep the e2e servers' logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: /tmp/gate-server-*.log
          if-no-files-found: warn

  # After the warehouse lane, not beside it: its guards query the warehouse too. It runs whether
  # or not that lane passed.
  planted-bugs:
    needs: gate-warehouse
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RECORD: "1"
      REPORT_DIR: ${{ github.workspace }}/verification-report
      CLICKHOUSE_MAX_INFLIGHT: "4"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - *env-local

      - name: Planted bugs
        run: npm run check:mutants

      - name: Keep this job's part of the verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report-mutants
          path: verification-report/
          if-no-files-found: warn

  # One verification-report artifact, as /verification describes it, from the jobs' parts.
  verification-report:
    needs: [gate-warehouse, planted-bugs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: verification-report
          pattern: verification-report-*
          delete-merged: true

  # Report-only: copy-paste (jscpd), unit-test coverage (node's, summarised on the job's page) and
  # security patterns (Semgrep's registry rule packs). None fails the run; the findings are kept as
  # the quality-report artifact, Semgrep's as SARIF.
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - run: npm ci

      - name: Duplication
        run: npm run report:dupes

      - name: Unit-test coverage
        run: npm run report:coverage

      - name: Security patterns
        run: npm run report:security

      - name: Keep the quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality-report/
          if-no-files-found: warn
